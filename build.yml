name: Build Sable Rapier Android plugin

on:
  push:
    paths: ['**.zip', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      sable_repo:
        description: Репозиторий с Rust-кодом sable_rapier
        default: ryanhcode/sable
      sable_ref:
        description: Тег/ветка/коммит (пусто = искать тег с 2.0.5)
        default: ''
      crate_dir:
        description: Папка с Cargo.toml (пусто = найти автоматически)
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SABLE_REPO: ${{ inputs.sable_repo || 'ryanhcode/sable' }}
      SABLE_REF: ${{ inputs.sable_ref }}
      CRATE_DIR: ${{ inputs.crate_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Unzip plugin project
        run: |
          Z=""
          for f in $(find . -maxdepth 2 -name '*.zip' -not -path './.git/*'); do
            if unzip -l "$f" | grep -q 'patch_sable_jar.py'; then Z="$f"; break; fi
          done
          [ -n "$Z" ] || { echo "ZIP с проектом плагина не найден в репозитории"; ls -R | head -50; exit 1; }
          echo "ZIP: $Z"
          mkdir -p proj && unzip -q -o "$Z" -d proj
          G=$(find proj -name gradlew | head -n1)
          [ -n "$G" ] || { echo "gradlew не найден в ZIP"; exit 1; }
          echo "PROJ=$(realpath "$(dirname "$G")")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Rust nightly + Android target
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Clone Sable sources
        run: |
          git clone "https://github.com/$SABLE_REPO" src
          cd src
          REF="$SABLE_REF"
          if [ -z "$REF" ]; then
            REF=$(git tag -l '*2.0.5*' | head -n1)
            [ -n "$REF" ] || { echo "Тег 2.0.5 не найден. Последние теги:"; git tag | tail -30; exit 1; }
          fi
          echo "Используем $REF"; git checkout "$REF"
          git submodule update --init --recursive || true

      - name: Locate crate
        run: |
          D="$CRATE_DIR"
          if [ -z "$D" ]; then
            F=$(grep -rlE '^name *= *"sable_rapier"' --include=Cargo.toml src | head -n1)
            [ -n "$F" ] || { echo "Cargo.toml с sable_rapier не найден — укажите crate_dir"; find src -name Cargo.toml; exit 1; }
            D=$(dirname "$F")
          else D="src/$D"; fi
          echo "CRATE=$D" >> "$GITHUB_ENV"; echo "Crate: $D"

      - name: Build native lib (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cd "$CRATE"
          cargo ndk -t arm64-v8a -o "$GITHUB_WORKSPACE/ndk_out" build --release
          ls -la "$GITHUB_WORKSPACE/ndk_out/arm64-v8a"

      - name: Install lib into plugin
        run: |
          SO=$(ls ndk_out/arm64-v8a/*.so | head -n1)
          mkdir -p "$PROJ/app/src/main/jniLibs/arm64-v8a"
          cp "$SO" "$PROJ/app/src/main/jniLibs/arm64-v8a/libsable_rapier.so"
          cp "$SO" sable_rapier_aarch64_android.so
          readelf -d "$SO" | grep NEEDED || true

      - name: Build plugin APK
        run: |
          cd "$PROJ"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"

      - name: Patch Sable jar (если jar есть в репозитории или в ZIP)
        run: |
          JAR=$(find . -name 'sable-neoforge*.jar' -not -path './out/*' | head -n1 || true)
          if [ -n "$JAR" ]; then
            python3 "$PROJ/scripts/patch_sable_jar.py" "$JAR" sable_rapier_aarch64_android.so "out/$(basename "$JAR" .jar)-android.jar"
          else echo "jar Sable не найден — пропускаю"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: sable-rapier-android
          path: |
            out/*
            sable_rapier_aarch64_android.so
